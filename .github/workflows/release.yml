name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-checks.yml
    secrets: inherit

  release:
    name: Release
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - checks
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
          cache: true
      - name: Dry-run version bump
        id: dry-run
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto --dry-run
        continue-on-error: true
      - name: Decide whether to release
        id: decide
        run: echo "should_release=${{ steps.dry-run.outcome == 'success' }}" >> "$GITHUB_OUTPUT"
      - name: Bump version
        if: steps.decide.outputs.should_release == 'true'
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
      - name: Push release commit and tag
        if: steps.decide.outputs.should_release == 'true'
        run: git push && git push --tags
      - name: Get version tag
        if: steps.decide.outputs.should_release == 'true'
        id: version
        run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        uses: cocogitto/cocogitto-action@v4
        with:
          command: changelog
          args: --at ${{ needs.release.outputs.version }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.version }}
          body: ${{ steps.changelog.outputs.stdout }}
          generate_release_notes: false
